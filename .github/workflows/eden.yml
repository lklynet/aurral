name: Eden

on:
  pull_request:
    paths:
      - "eden/**"
      - ".github/workflows/eden.yml"
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eden-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    name: Journeys
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-ffmpeg

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]

      - run: vp run eden test

      - if: failure()
        run: |
          tail -n 200 .eden/aurral/logs/aurral.log || true
          docker compose ls
