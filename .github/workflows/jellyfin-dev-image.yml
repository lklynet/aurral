name: Jellyfin development image

on:
  push:
    branches: ["jellyfin-preserve-additions"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jellyfin-dev-image
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'ApolloVulpez/aurral' && github.ref == 'refs/heads/jellyfin-preserve-additions'
    uses: ./.github/workflows/validate.yml

  publish-image:
    if: github.repository == 'ApolloVulpez/aurral' && github.ref == 'refs/heads/jellyfin-preserve-additions'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve build version
        id: version
        run: echo "value=jellyfin-playlist-dev.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:7}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log into ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish development image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/apollovulpez/aurral:jellyfin-dev
          labels: org.opencontainers.image.source=https://github.com/ApolloVulpez/aurral
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            GITHUB_REPO=ApolloVulpez/aurral
            RELEASE_CHANNEL=preview
          cache-from: type=gha
          cache-to: type=gha,mode=max
