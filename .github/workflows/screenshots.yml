name: Screenshots

# Retakes the README, docs, and aurral.org screenshots in Eden's showroom once a day and
# keeps one pull request with whatever changed, for a maintainer to merge.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  capture:
    if: github.repository == 'lklynet/aurral'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.YTDLP_UPDATE_TOKEN }}

      - uses: ./.github/actions/install-ffmpeg

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/aurral-eden/art
          key: eden-art-${{ hashFiles('eden/scenes/showroom/catalogue/**') }}
          restore-keys: eden-art-

      - run: pnpm exec playwright-core install --with-deps chromium

      - run: vp run eden shots

      - name: Open or update the screenshots PR
        env:
          GH_TOKEN: ${{ secrets.YTDLP_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="bot/screenshots"
          OPEN=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if git diff --quiet -- web/screenshots; then
            echo "The screenshots match the app."
            if [ -n "$OPEN" ]; then gh pr close "$OPEN" --delete-branch --comment "The screenshots on main match the app again."; fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add web/screenshots
          git commit -m "docs: retake screenshots"
          git push --force origin "$BRANCH"
          if [ -z "$OPEN" ]; then
            gh pr create --head "$BRANCH" --title "docs: retake screenshots" \
              --body "The app changed since the README, docs, and aurral.org screenshots were taken. These are retaken in Eden's showroom by the Screenshots workflow, which updates this PR once a day until it is merged."
          fi

      - if: failure()
        run: tail -n 200 .eden/aurral/logs/aurral.log || true
