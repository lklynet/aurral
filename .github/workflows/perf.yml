name: Perf

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: perf-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  perf:
    name: Perf
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # The checkout is main merged with this PR, so its first parent is the main it merges into.
      - id: diff
        run: |
          if git diff --quiet HEAD^1 HEAD -- backend frontend lib package.json pnpm-lock.yaml .nvmrc scripts/perf.mts .tests/perf .tests/helpers .github/workflows/perf.yml; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - if: steps.diff.outputs.changed == 'true'
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]

      - name: Set up main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git worktree add ../base HEAD^1
          if [ ! -f ../base/scripts/perf.mts ]; then
            cp scripts/perf.mts ../base/scripts/
            cp -r .tests/perf ../base/.tests/
          fi
          cd ../base
          vp install --frozen-lockfile
          vp run build

      - if: steps.diff.outputs.changed == 'true'
        run: vp run build

      # Read labels now, not from the event, so adding perf-accepted and re-running the job applies it.
      - name: Compare
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          if gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx perf-accepted; then
            node scripts/perf.mts compare ../base --report-only
          else
            node scripts/perf.mts compare ../base
          fi
