name: Nightly

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  publish-image:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify manual run uses main
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Manual nightly reconciliation must run from main, not ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Resolve build version
        id: version
        run: echo "value=nightly.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:7}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log into ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nightly image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository }}:nightly
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            GITHUB_REPO=${{ github.repository }}
            RELEASE_CHANNEL=nightly
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update release readiness record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_VERSION: ${{ steps.version.outputs.value }}
        run: bash scripts/update-release-readiness.sh nightly

      - name: Notify merged pull requests and linked issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_VERSION: ${{ steps.version.outputs.value }}
        run: bash scripts/notify-github-status.sh nightly
