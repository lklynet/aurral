name: Validate

on:
  workflow_call:
    inputs:
      concurrency-key:
        description: Additional key for callers that must validate separate commits independently.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}-${{ inputs.concurrency-key }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, build, and start
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
            - cwd: docs
              args: ["--frozen-lockfile"]

      - run: vp run check

      - name: Build app
        run: vp run build

      - name: Build docs
        run: npm run build
        working-directory: docs

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: vp exec playwright install --only-shell chromium

      - name: Run component tests in Chromium
        run: vp test run --project browser

      - name: Start app
        run: |
          touch backend/.env
          npm start > /tmp/aurral.log 2>&1 &
          echo $! > /tmp/aurral.pid

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/api/health > /tmp/aurral-health.json; then
              cat /tmp/aurral-health.json
              exit 0
            fi
            sleep 2
          done
          if [ -f /tmp/aurral.log ]; then
            cat /tmp/aurral.log
          else
            echo "App log not found at /tmp/aurral.log"
          fi
          exit 1

      - name: Run browser checks with faked APIs
        env:
          AURRAL_BASE_URL: http://127.0.0.1:3001
        run: >-
          vp exec playwright test --workers=4 --fully-parallel
          tests/e2e/library-track-performer.spec.js
          tests/e2e/library-add-menu.spec.js
          tests/e2e/playlist-bulk-actions.spec.js
          tests/e2e/local-album-artwork.spec.js

      - name: Print app log on failure
        if: failure()
        run: |
          if [ -f /tmp/aurral.log ]; then
            cat /tmp/aurral.log
          else
            echo "App log not found at /tmp/aurral.log"
          fi

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/aurral.pid ]; then
            kill "$(cat /tmp/aurral.pid)" || true
          fi

  unit-tests:
    name: Unit tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/install-ffmpeg

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]

      - name: Run test suite
        run: vp run test --shard=${{ matrix.shard }}/2

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/install-ffmpeg

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]

      - name: Run integration tests
        run: vp run test:integration

  container:
    name: Production container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Dockerfile
        run: docker build --check .

      - name: Build and smoke-test production container
        run: |
          IMAGE="aurral-ci:${GITHUB_SHA}"
          CONTAINER="aurral-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            docker image rm "$IMAGE" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker build \
            --build-arg "APP_VERSION=ci-${GITHUB_SHA}" \
            --tag "$IMAGE" \
            .
          docker run --detach --name "$CONTAINER" --env PUID=3007 --env PGID=3001 "$IMAGE"

          ready=0
          for i in {1..30}; do
            if docker exec "$CONTAINER" node -e \
              'fetch("http://127.0.0.1:3001/api/health").then((response) => { if (!response.ok) process.exit(1); })'; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            docker logs "$CONTAINER"
            exit 1
          fi

          docker exec "$CONTAINER" node --input-type=module -e \
            'import fs from "node:fs/promises"; const status = await fs.readFile("/proc/1/status", "utf8"); const groups = status.match(/^Groups:\s*(.*)$/m)?.[1].trim().split(/\s+/).filter(Boolean) || []; if (!groups.includes("3001")) { console.error(status); process.exit(1); }'

          # The native matcher is part of the running backend.
          docker exec "$CONTAINER" node -e \
            'fetch("http://127.0.0.1:3001/api/health").then((r) => r.json()).then((body) => { if (body.matcher?.available !== true || !body.matcher?.policyVersion) { console.error("native matcher not available in health payload:", JSON.stringify(body.matcher)); process.exit(1); } })'

          docker logs "$CONTAINER"

  # Branch protection requires this check name.
  validate:
    if: ${{ !cancelled() }}
    needs: [checks, unit-tests, integration-tests, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "Validation jobs did not all succeed: $RESULTS"
              exit 1
            fi
          done
