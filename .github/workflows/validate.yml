name: Validate

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'lklynet' && 'aurral-personal' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Ensure validation runtime dependencies
        run: |
          if command -v fc-match >/dev/null 2>&1 && command -v ffmpeg >/dev/null 2>&1 && [ "$(fc-match -f '%{family}' 'Noto Color Emoji')" = "Noto Color Emoji" ]; then
            exit 0
          fi

          if [ "$(id -u)" -eq 0 ]; then
            apt-get update
            apt-get install -y ffmpeg fontconfig fonts-dejavu-core fonts-noto-color-emoji
          elif command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core fonts-noto-color-emoji
          else
            echo "ffmpeg and fontconfig are required for validation."
            echo "Install ffmpeg, fontconfig, fonts-dejavu-core, and fonts-noto-color-emoji on the runner."
            exit 1
          fi

      - run: npm ci

      - run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Build app
        run: npm run build

      - name: Build docs
        run: |
          npm ci
          npm run build
        working-directory: docs

      - name: Start app
        run: |
          touch backend/.env
          npm start > /tmp/aurral.log 2>&1 &
          echo $! > /tmp/aurral.pid

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/api/health > /tmp/aurral-health.json; then
              cat /tmp/aurral-health.json
              exit 0
            fi
            sleep 2
          done
          if [ -f /tmp/aurral.log ]; then
            cat /tmp/aurral.log
          else
            echo "App log not found at /tmp/aurral.log"
          fi
          exit 1

      - name: Print app log on failure
        if: failure()
        run: |
          if [ -f /tmp/aurral.log ]; then
            cat /tmp/aurral.log
          else
            echo "App log not found at /tmp/aurral.log"
          fi

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/aurral.pid ]; then
            kill "$(cat /tmp/aurral.pid)" || true
          fi

      - name: Check Dockerfile
        run: docker build --check .

      - name: Build and smoke-test production container
        run: |
          IMAGE="aurral-ci:${GITHUB_SHA}"
          CONTAINER="aurral-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            docker image rm "$IMAGE" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker build \
            --build-arg "APP_VERSION=ci-${GITHUB_SHA}" \
            --tag "$IMAGE" \
            .
          docker run --detach --name "$CONTAINER" --env PUID=3007 --env PGID=3001 "$IMAGE"

          ready=0
          for i in {1..30}; do
            if docker exec "$CONTAINER" node -e \
              'fetch("http://127.0.0.1:3001/api/health").then((response) => { if (!response.ok) process.exit(1); })'; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            docker logs "$CONTAINER"
            exit 1
          fi

          docker exec "$CONTAINER" node --input-type=module -e \
            'import fs from "node:fs/promises"; const status = await fs.readFile("/proc/1/status", "utf8"); const groups = status.match(/^Groups:\s*(.*)$/m)?.[1].trim().split(/\s+/).filter(Boolean) || []; if (!groups.includes("3001")) { console.error(status); process.exit(1); }'

          docker logs "$CONTAINER"
