name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, build, and start
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]

      - run: vp run check

      - name: Build app
        run: vp run build

      - name: Build docs
        run: vp run docs:build

      - name: Start app
        run: |
          touch backend/.env
          pnpm start > /tmp/aurral.log 2>&1 &
          echo $! > /tmp/aurral.pid

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/api/health > /tmp/aurral-health.json; then
              cat /tmp/aurral-health.json
              exit 0
            fi
            sleep 2
          done
          if [ -f /tmp/aurral.log ]; then
            cat /tmp/aurral.log
          else
            echo "App log not found at /tmp/aurral.log"
          fi
          exit 1

      - name: Print app log on failure
        if: failure()
        run: |
          if [ -f /tmp/aurral.log ]; then
            cat /tmp/aurral.log
          else
            echo "App log not found at /tmp/aurral.log"
          fi

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/aurral.pid ]; then
            kill "$(cat /tmp/aurral.pid)" || true
          fi

  unit-tests:
    name: Unit tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/install-ffmpeg

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]

      - name: Run test suite
        run: vp run test --shard=${{ matrix.shard }}/2

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/install-ffmpeg

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]

      - name: Run integration tests
        run: vp run test:integration

  container:
    name: Production container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Dockerfile
        run: docker build --check .

      - name: Choose image settings
        id: image
        env:
          PREVIEW: >-
            ${{
              github.event_name == 'pull_request' &&
              github.base_ref == 'main' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.event.pull_request.user.login != 'dependabot[bot]'
            }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          if [ "${PREVIEW}" = "true" ]; then
            {
              echo "preview=true"
              echo "version=pr.${PR_NUMBER}+${HEAD_SHA:0:7}"
              echo "channel=preview"
              echo "tag=pr-${PR_NUMBER}"
            } >> "${GITHUB_OUTPUT}"
          else
            {
              echo "preview=false"
              echo "version=ci-${HEAD_SHA}"
              echo "channel=stable"
            } >> "${GITHUB_OUTPUT}"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: aurral-ci:${{ github.sha }}
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.image.outputs.version }}
            GITHUB_REPO=${{ github.repository }}
            RELEASE_CHANNEL=${{ steps.image.outputs.channel }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test production container
        run: |
          IMAGE="aurral-ci:${GITHUB_SHA}"
          CONTAINER="aurral-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$CONTAINER" --env PUID=3007 --env PGID=3001 "$IMAGE"

          ready=0
          for i in {1..30}; do
            if docker exec "$CONTAINER" node -e \
              'fetch("http://127.0.0.1:3001/api/health").then((response) => { if (!response.ok) process.exit(1); })'; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            docker logs "$CONTAINER"
            exit 1
          fi

          docker exec "$CONTAINER" node --input-type=module -e \
            'import fs from "node:fs/promises"; const status = await fs.readFile("/proc/1/status", "utf8"); const groups = status.match(/^Groups:\s*(.*)$/m)?.[1].trim().split(/\s+/).filter(Boolean) || []; if (!groups.includes("3001")) { console.error(status); process.exit(1); }'

          # The native matcher is part of the running backend.
          docker exec "$CONTAINER" node -e \
            'fetch("http://127.0.0.1:3001/api/health").then((r) => r.json()).then((body) => { if (body.matcher?.available !== true || !body.matcher?.policyVersion) { console.error("native matcher not available in health payload:", JSON.stringify(body.matcher)); process.exit(1); } })'

          docker logs "$CONTAINER"

      - name: Log into ghcr.io
        if: steps.image.outputs.preview == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push preview image
        if: steps.image.outputs.preview == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.image.outputs.tag }}
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.image.outputs.version }}
            GITHUB_REPO=${{ github.repository }}
            RELEASE_CHANNEL=${{ steps.image.outputs.channel }}
          cache-from: type=gha

      - name: Comment preview image on pull request and linked issues
        if: steps.image.outputs.preview == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          PR_NUMBER: ${{ github.event.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "### Preview image"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${REPOSITORY}:${IMAGE_TAG}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          bash scripts/comment-preview-image.sh

  # Branch protection requires this check name.
  validate:
    if: ${{ !cancelled() }}
    needs: [checks, unit-tests, integration-tests, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "Validation jobs did not all succeed: $RESULTS"
              exit 1
            fi
          done
