name: Validate

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.9.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Ensure validation runtime dependencies
        run: |
          if command -v fc-match >/dev/null 2>&1 && command -v ffmpeg >/dev/null 2>&1 && [ "$(fc-match -f '%{family}' 'Noto Color Emoji')" = "Noto Color Emoji" ]; then
            exit 0
          fi

          apt_prefix=()
          if [ "$(id -u)" -ne 0 ]; then
            if command -v sudo >/dev/null 2>&1; then
              apt_prefix=(sudo)
            else
              echo "ffmpeg and fontconfig are required for validation."
              echo "Install ffmpeg, fontconfig, fonts-dejavu-core, and fonts-noto-color-emoji on the runner."
              exit 1
            fi
          fi

          chrome_sources=()
          restore_chrome_sources() {
            for source in "${chrome_sources[@]}"; do
              "${apt_prefix[@]}" mv "$source.disabled" "$source"
            done
          }
          trap restore_chrome_sources EXIT

          while IFS= read -r source; do
            "${apt_prefix[@]}" mv "$source" "$source.disabled"
            chrome_sources+=("$source")
          done < <(grep -ril 'dl.google.com/linux/chrome' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true)

          "${apt_prefix[@]}" apt-get update
          "${apt_prefix[@]}" apt-get install -y ffmpeg fontconfig fonts-dejavu-core fonts-noto-color-emoji

      - run: npm ci

      - name: Set up bundled beets matcher runtime
        run: |
          matcher_venv="${RUNNER_TEMP:-/tmp}/aurral-beets-venv"
          python3 -m venv "$matcher_venv"
          "$matcher_venv/bin/pip" install --no-compile -r backend/matcher/requirements.txt
          echo "AURRAL_MATCHER_PYTHON=$matcher_venv/bin/python" >> "$GITHUB_ENV"

      - run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Build app
        run: npm run build

      - name: Build docs
        run: |
          npm ci
          npm run build
        working-directory: docs

      - name: Start app
        run: |
          touch backend/.env
          npm start > /tmp/aurral.log 2>&1 &
          echo $! > /tmp/aurral.pid

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/api/health > /tmp/aurral-health.json; then
              cat /tmp/aurral-health.json
              exit 0
            fi
            sleep 2
          done
          if [ -f /tmp/aurral.log ]; then
            cat /tmp/aurral.log
          else
            echo "App log not found at /tmp/aurral.log"
          fi
          exit 1

      - name: Print app log on failure
        if: failure()
        run: |
          if [ -f /tmp/aurral.log ]; then
            cat /tmp/aurral.log
          else
            echo "App log not found at /tmp/aurral.log"
          fi

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/aurral.pid ]; then
            kill "$(cat /tmp/aurral.pid)" || true
          fi

      - name: Check Dockerfile
        run: docker build --check .

      - name: Build and smoke-test production container
        run: |
          IMAGE="aurral-ci:${GITHUB_SHA}"
          CONTAINER="aurral-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            docker image rm "$IMAGE" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker build \
            --build-arg "APP_VERSION=ci-${GITHUB_SHA}" \
            --tag "$IMAGE" \
            .
          docker run --detach --name "$CONTAINER" --env PUID=3007 --env PGID=3001 "$IMAGE"

          ready=0
          for i in {1..30}; do
            if docker exec "$CONTAINER" node -e \
              'fetch("http://127.0.0.1:3001/api/health").then((response) => { if (!response.ok) process.exit(1); })'; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            docker logs "$CONTAINER"
            exit 1
          fi

          docker exec "$CONTAINER" node --input-type=module -e \
            'import fs from "node:fs/promises"; const status = await fs.readFile("/proc/1/status", "utf8"); const groups = status.match(/^Groups:\s*(.*)$/m)?.[1].trim().split(/\s+/).filter(Boolean) || []; if (!groups.includes("3001")) { console.error(status); process.exit(1); }'

          # The bundled beets matcher is production-critical: run the packaged
          # interpreter against the packaged matcher script and confirm the
          # pinned version answers a health request that also scores a track.
          matcher_health="$(docker exec "$CONTAINER" sh -c \
            'printf "{\"protocol\":1,\"operation\":\"health\"}" | /opt/aurral-matcher/bin/python backend/matcher/aurral_matcher.py')"
          echo "$matcher_health"
          echo "$matcher_health" | grep -q '"ok":true' || { echo "packaged matcher did not answer health"; exit 1; }
          echo "$matcher_health" | grep -q '"beetsVersion":"2.14.1"' || { echo "packaged beets is not the pinned version"; exit 1; }

          # The running app must have completed the matcher startup self-test.
          docker exec "$CONTAINER" node -e \
            'fetch("http://127.0.0.1:3001/api/health").then((r) => r.json()).then((body) => { if (body.matcher?.available !== true) { console.error("matcher runtime not available in health payload:", JSON.stringify(body.matcher)); process.exit(1); } })'

          docker logs "$CONTAINER"
