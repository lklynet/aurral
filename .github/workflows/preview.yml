name: Preview

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  publish-image:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve build version
        id: version
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "value=pr.${{ github.event.number }}+${HEAD_SHA:0:7}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log into ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            GITHUB_REPO=${{ github.repository }}
            RELEASE_CHANNEL=preview
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize preview image
        run: |
          {
            echo "### Preview image"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY}:pr-${{ github.event.number }}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment preview image on pull request and linked issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: pr-${{ github.event.number }}
          PR_NUMBER: ${{ github.event.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          COMMENT_BODY="$(cat <<EOF
          <!-- aurral-preview-image -->
          ## Aurral preview image ready

          This image was rebuilt from the latest push to this pull request. It will be replaced when you push another change.

          \`\`\`bash
          docker pull ghcr.io/${REPOSITORY}:${IMAGE_TAG}
          \`\`\`

          To test it with your existing Docker Compose setup:

          1. Back up your Aurral config.
          2. Temporarily change the Aurral service image to \`ghcr.io/${REPOSITORY}:${IMAGE_TAG}\`.
          3. Run \`docker compose pull aurral && docker compose up -d aurral\`.
          4. Exercise the behavior changed by this pull request.
          5. Restore the image reference that was configured before testing.

          [View the preview workflow run](https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}) · [Report a problem](https://github.com/${REPOSITORY}/issues)
          EOF
          )"

          COMMENT_ID="$(gh api --paginate \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- aurral-preview-image -->"))) | .id' | head -n1)"

          if [ -n "${COMMENT_ID}" ]; then
            gh api \
              --method PATCH \
              "repos/${REPOSITORY}/issues/comments/${COMMENT_ID}" \
              -f "body=${COMMENT_BODY}" >/dev/null
          else
            gh pr comment "${PR_NUMBER}" \
              --repo "${REPOSITORY}" \
              --body "${COMMENT_BODY}" >/dev/null
          fi

          OWNER="${REPOSITORY%%/*}"
          REPO="${REPOSITORY#*/}"
          ISSUE_MARKER="aurral-preview-issue-${PR_NUMBER}"
          CLOSING_ISSUES="$(gh api graphql \
            -f query='query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  closingIssuesReferences(first: 100) {
                    nodes { number }
                  }
                }
              }
            }' \
            -f "owner=${OWNER}" \
            -f "repo=${REPO}" \
            -F "number=${PR_NUMBER}" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[]?.number')"

          if [ -n "${CLOSING_ISSUES}" ]; then
            gh label create in-progress \
              --repo "${REPOSITORY}" \
              --color FBCA04 \
              --description "Linked pull request is open and being worked on." \
              --force >/dev/null
          fi

          while IFS= read -r issue_number; do
            [ -z "${issue_number}" ] && continue

            ISSUE_COMMENT_BODY="$(cat <<EOF
          <!-- ${ISSUE_MARKER} -->
          ## Aurral preview image ready

          [Pull request #${PR_NUMBER}](https://github.com/${REPOSITORY}/pull/${PR_NUMBER}), which is linked to this issue, has a preview image ready to test before it is merged into \`nightly\`. It will be replaced when the pull request changes.

          \`\`\`bash
          docker pull ghcr.io/${REPOSITORY}:${IMAGE_TAG}
          \`\`\`

          To test it with your existing Docker Compose setup:

          1. Back up your Aurral config.
          2. Temporarily change the Aurral service image to \`ghcr.io/${REPOSITORY}:${IMAGE_TAG}\`.
          3. Run \`docker compose pull aurral && docker compose up -d aurral\`.
          4. Exercise the behavior changed by the pull request.
          5. Restore the image reference that was configured before testing.

          Please report your results and approval on the pull request before it is merged into nightly.

          [View the preview workflow run](https://github.com/${REPOSITORY}/actions/runs/${RUN_ID})
          EOF
            )"

            COMMENT_ID="$(gh api --paginate \
              "repos/${REPOSITORY}/issues/${issue_number}/comments" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"<!-- ${ISSUE_MARKER} -->\"))) | .id" | head -n1)"

            if [ -n "${COMMENT_ID}" ]; then
              gh api \
                --method PATCH \
                "repos/${REPOSITORY}/issues/comments/${COMMENT_ID}" \
                -f "body=${ISSUE_COMMENT_BODY}" >/dev/null
            else
              gh api \
                --method POST \
                "repos/${REPOSITORY}/issues/${issue_number}/comments" \
                -f "body=${ISSUE_COMMENT_BODY}" >/dev/null
            fi

            gh api \
              --method POST \
              "repos/${REPOSITORY}/issues/${issue_number}/labels" \
              -f "labels[]=in-progress" >/dev/null
          done <<< "${CLOSING_ISSUES}"

  delete-image:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
      packages: write
    steps:
      - name: Delete preview image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: pr-${{ github.event.number }}
        run: |
          OWNER="${GITHUB_REPOSITORY%/*}"
          PACKAGE="${GITHUB_REPOSITORY#*/}"
          for scope in users orgs; do
            VERSION_ID="$(gh api --paginate "/${scope}/${OWNER}/packages/container/${PACKAGE}/versions" \
              -q ".[] | select(.metadata.container.tags[]? == \"${IMAGE_TAG}\") | .id" 2>/dev/null | head -n1)"
            if [ -n "${VERSION_ID}" ]; then
              gh api -X DELETE "/${scope}/${OWNER}/packages/container/${PACKAGE}/versions/${VERSION_ID}"
              echo "Deleted ${IMAGE_TAG}."
              exit 0
            fi
          done
          echo "No preview image tagged ${IMAGE_TAG}."

      - name: Invalidate linked issue preview comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_NUMBER: ${{ github.event.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          OWNER="${REPOSITORY%%/*}"
          REPO="${REPOSITORY#*/}"
          ISSUE_MARKER="aurral-preview-issue-${PR_NUMBER}"
          if [ "${PR_MERGED}" = "true" ]; then
            COMMENT_BODY="$(cat <<EOF
          <!-- ${ISSUE_MARKER} -->
          ## Aurral preview image retired

          [Pull request #${PR_NUMBER}](https://github.com/${REPOSITORY}/pull/${PR_NUMBER}) was merged into \`main\`. The preview image was retired. The change will appear on \`nightly\` after that build succeeds, and linked issues stay open until a stable release includes it.
          EOF
            )"
          else
            COMMENT_BODY="$(cat <<EOF
          <!-- ${ISSUE_MARKER} -->
          ## Aurral preview image no longer available

          The preview image for [pull request #${PR_NUMBER}](https://github.com/${REPOSITORY}/pull/${PR_NUMBER}) was retired because the pull request was closed without merging. It is no longer available for testing.
          EOF
            )"
          fi
          CLOSING_ISSUES="$(gh api graphql \
            -f query='query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  closingIssuesReferences(first: 100) {
                    nodes { number }
                  }
                }
              }
            }' \
            -f "owner=${OWNER}" \
            -f "repo=${REPO}" \
            -F "number=${PR_NUMBER}" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[]?.number')"

          while IFS= read -r issue_number; do
            [ -z "${issue_number}" ] && continue

            COMMENT_ID="$(gh api --paginate \
              "repos/${REPOSITORY}/issues/${issue_number}/comments" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"<!-- ${ISSUE_MARKER} -->\"))) | .id" | head -n1)"

            if [ -n "${COMMENT_ID}" ]; then
              gh api \
                --method PATCH \
                "repos/${REPOSITORY}/issues/comments/${COMMENT_ID}" \
                -f "body=${COMMENT_BODY}" >/dev/null
            fi

            if ! DELETE_OUTPUT="$(gh api \
                --method DELETE \
                "repos/${REPOSITORY}/issues/${issue_number}/labels/in-progress" \
                --include \
                --silent 2>&1)"; then
              DELETE_STATUS="$(printf '%s\n' "${DELETE_OUTPUT}" | awk 'NR == 1 { print $2; exit }')"
              if [ "${DELETE_STATUS}" != "404" ]; then
                printf '%s\n' "${DELETE_OUTPUT}" >&2
                exit 1
              fi
            fi
          done <<< "${CLOSING_ISSUES}"
