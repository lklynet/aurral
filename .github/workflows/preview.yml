name: Preview

on:
  pull_request:
    branches: ["main"]
    types: [closed]

permissions:
  contents: read

jobs:
  delete-image:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - name: Delete preview image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: pr-${{ github.event.number }}
        run: |
          owner="${GITHUB_REPOSITORY%/*}"
          package="${GITHUB_REPOSITORY#*/}"
          for scope in users orgs; do
            id="$(gh api --paginate "/${scope}/${owner}/packages/container/${package}/versions?per_page=100" \
              --jq ".[] | select(.metadata.container.tags | index(\"${IMAGE_TAG}\")) | .id" 2>/dev/null)" || id=""
            id="${id%%$'\n'*}"
            if [ -n "${id}" ]; then
              gh api -X DELETE "/${scope}/${owner}/packages/container/${package}/versions/${id}"
              echo "Deleted ${IMAGE_TAG}."
              exit 0
            fi
          done
          echo "No image tagged ${IMAGE_TAG}."
