name: Deploy Prerelease

on:
  push:
    branches: ["dev", "test"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  guard-head:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      is_current_head: ${{ steps.guard.outputs.is_current_head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify workflow commit is current branch head
        id: guard
        run: |
          git fetch origin "+${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}" --depth=1
          REMOTE_SHA="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [ "${REMOTE_SHA}" = "${GITHUB_SHA}" ]; then
            echo "is_current_head=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "Workflow run is stale for ${GITHUB_REF_NAME}: head=${REMOTE_SHA} run=${GITHUB_SHA}"
          echo "is_current_head=false" >> "${GITHUB_OUTPUT}"

  compute-release:
    needs: guard-head
    if: needs.guard-head.outputs.is_current_head == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2

      - name: Compute prerelease version
        id: release
        run: |
          git fetch --force --tags
          TAGS="$(git tag --list | tr '\n' ',')"
          HEAD_TAGS="$(git tag --points-at HEAD | tr '\n' ',')"
          node scripts/resolve-next-release.js \
            --branch "${GITHUB_REF_NAME}" \
            --tags "${TAGS}" \
            --head-tags "${HEAD_TAGS}" \
            --github-output true

  publish-image:
    needs: compute-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log into ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.compute-release.outputs.version }}
            type=raw,value=${{ needs.compute-release.outputs.channel }}

      - name: Build and push prerelease image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ needs.compute-release.outputs.version }}
            GITHUB_REPO=${{ github.repository }}
            RELEASE_CHANNEL=${{ needs.compute-release.outputs.channel }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-tag:
    needs: [compute-release, publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Create or confirm annotated prerelease tag
        env:
          RELEASE_TAG: ${{ needs.compute-release.outputs.tag }}
        run: |
          git fetch --force --tags
          if git rev-parse "${RELEASE_TAG}^{commit}" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-parse "${RELEASE_TAG}^{commit}")"
            if [ "${TAG_SHA}" != "${GITHUB_SHA}" ]; then
              echo "Tag ${RELEASE_TAG} already points to ${TAG_SHA}, not ${GITHUB_SHA}."
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already exists at this commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${GITHUB_SHA}" -m "Aurral ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"
