name: Container image scan

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRIVY_PLATFORM: ${{ matrix.platform }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan latest stable image for OS vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "ghcr.io/${{ github.repository }}:latest"
          format: sarif
          output: trivy-image-os-${{ matrix.arch }}.sarif
          vuln-type: os
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: "true"
          exit-code: "0"

      - name: Upload image scan results
        if: ${{ always() && hashFiles(format('trivy-image-os-{0}.sarif', matrix.arch)) != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-image-os-${{ matrix.arch }}.sarif
          category: trivy-image-os-${{ matrix.arch }}
