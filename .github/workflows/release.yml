name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (for example 2.1.0). Leave blank to use the version suggested by Conventional Commit titles since the last release.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  guard-main:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify main is the release source
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Releases must be run from main, not ${GITHUB_REF_NAME}."
            exit 1
          fi

          git fetch origin "+main:refs/remotes/origin/main" --depth=1
          REMOTE_SHA="$(git rev-parse origin/main)"
          if [ "${REMOTE_SHA}" != "${GITHUB_SHA}" ]; then
            echo "Workflow commit ${GITHUB_SHA} is not current origin/main ${REMOTE_SHA}."
            exit 1
          fi

  compute-release:
    needs: guard-main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      - name: Compute release version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          git fetch --force --tags
          node scripts/resolve-next-release.js

  check-release-readiness:
    needs: compute-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      existing_release: ${{ steps.readiness.outputs.existing_release }}
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require approved release-readiness record
        id: readiness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.compute-release.outputs.tag }}
        run: bash scripts/update-release-readiness.sh check

  publish-image:
    needs: [compute-release, check-release-readiness]
    if: needs.check-release-readiness.outputs.existing_release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log into ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.compute-release.outputs.version }}
            type=raw,value=${{ needs.compute-release.outputs.minor }}
            type=raw,value=${{ needs.compute-release.outputs.major }}
            type=raw,value=latest

      - name: Build and push stable image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ needs.compute-release.outputs.version }}
            GITHUB_REPO=${{ github.repository }}
            RELEASE_CHANNEL=stable
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-tag:
    needs: [compute-release, check-release-readiness, publish-image]
    if: ${{ always() && (needs.publish-image.result == 'success' || needs.check-release-readiness.outputs.existing_release == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create or confirm annotated release tag
        env:
          RELEASE_TAG: ${{ needs.compute-release.outputs.tag }}
        run: |
          git fetch --force --tags
          if git rev-parse "${RELEASE_TAG}^{commit}" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-parse "${RELEASE_TAG}^{commit}")"
            if [ "${TAG_SHA}" != "${GITHUB_SHA}" ]; then
              echo "Tag ${RELEASE_TAG} already points to ${TAG_SHA}, not ${GITHUB_SHA}."
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already exists at this commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${GITHUB_SHA}" -m "Aurral ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

  publish-github-release:
    needs: [compute-release, create-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.compute-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.compute-release.outputs.version }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists."
            exit 0
          fi

          NOTES_FILE="release-notes/${RELEASE_VERSION}.md"
          if [ -f "${NOTES_FILE}" ]; then
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "Aurral ${RELEASE_TAG}" \
              --notes-file "${NOTES_FILE}" \
              --latest
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "Aurral ${RELEASE_TAG}" \
              --generate-notes \
              --latest
          fi

  notify-github-release:
    needs: [compute-release, publish-github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Close release-readiness record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.compute-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.compute-release.outputs.version }}
        run: bash scripts/update-release-readiness.sh stable

      - name: Notify merged pull requests and linked issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.compute-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.compute-release.outputs.version }}
        run: bash scripts/notify-github-status.sh stable

      - name: Notify Discord releases channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_RELEASES: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          RELEASE_TAG: ${{ needs.compute-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.compute-release.outputs.version }}
        run: bash scripts/notify-discord.sh releases
