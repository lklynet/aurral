name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (for example 2.1.0). Leave blank to use the version suggested by Conventional Commit titles since the last release.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  compute-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify main is the release source
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Releases must be run from main, not ${GITHUB_REF_NAME}."
            exit 1
          fi

          git fetch origin "+main:refs/remotes/origin/main"
          REMOTE_SHA="$(git rev-parse origin/main)"
          if [ "${REMOTE_SHA}" != "${GITHUB_SHA}" ]; then
            echo "Workflow commit ${GITHUB_SHA} is not current origin/main ${REMOTE_SHA}."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Compute release version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          git fetch --force --tags
          node scripts/resolve-next-release.ts

  check-release-readiness:
    needs: compute-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      existing_release: ${{ steps.readiness.outputs.existing_release }}
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require approved release-readiness record
        id: readiness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.compute-release.outputs.tag }}
        run: bash scripts/update-release-readiness.sh check

  build-image:
    name: Build image (${{ matrix.arch }})
    needs: [compute-release, check-release-readiness]
    if: needs.check-release-readiness.outputs.existing_release != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            cache-scope: buildkit
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache-scope: buildkit-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log into ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.compute-release.outputs.version }}
            type=raw,value=${{ needs.compute-release.outputs.minor }}
            type=raw,value=${{ needs.compute-release.outputs.major }}
            type=raw,value=latest

      - name: Build and push stable image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          no-cache-filters: runtime
          provenance: mode=max
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION=${{ needs.compute-release.outputs.version }}
            GITHUB_REPO=${{ github.repository }}
            RELEASE_CHANNEL=stable
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

      - name: Record image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-image:
    needs: [compute-release, build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log into ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.compute-release.outputs.version }}
            type=raw,value=${{ needs.compute-release.outputs.minor }}
            type=raw,value=${{ needs.compute-release.outputs.major }}
            type=raw,value=latest

      - name: Publish multi-platform stable image
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t tag_args < <(jq -r '.tags[] | "--tag=" + .' <<< "${METADATA_JSON}")
          mapfile -t sources < <(printf "${IMAGE}@sha256:%s\n" *)
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "Expected 2 platform digests, found ${#sources[@]}."
            exit 1
          fi
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "${METADATA_JSON}")"

  scan-image:
    needs: publish-image
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/container-image-scan.yml

  create-tag:
    needs: [compute-release, check-release-readiness, publish-image]
    if: ${{ always() && (needs.publish-image.result == 'success' || needs.check-release-readiness.outputs.existing_release == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create or confirm annotated release tag
        env:
          RELEASE_TAG: ${{ needs.compute-release.outputs.tag }}
        run: |
          git fetch --force --tags
          if git rev-parse "${RELEASE_TAG}^{commit}" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-parse "${RELEASE_TAG}^{commit}")"
            if [ "${TAG_SHA}" != "${GITHUB_SHA}" ]; then
              echo "Tag ${RELEASE_TAG} already points to ${TAG_SHA}, not ${GITHUB_SHA}."
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already exists at this commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${GITHUB_SHA}" -m "Aurral ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

  publish-github-release:
    needs: [compute-release, create-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.compute-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.compute-release.outputs.version }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists."
            exit 0
          fi

          NOTES_FILE="release-notes/${RELEASE_VERSION}.md"
          if [ -f "${NOTES_FILE}" ]; then
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "Aurral ${RELEASE_TAG}" \
              --notes-file "${NOTES_FILE}" \
              --latest
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "Aurral ${RELEASE_TAG}" \
              --generate-notes \
              --latest
          fi

  notify-github-release:
    needs: [compute-release, publish-github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Close release-readiness record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.compute-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.compute-release.outputs.version }}
        run: bash scripts/update-release-readiness.sh stable

      - name: Notify merged pull requests and linked issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.compute-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.compute-release.outputs.version }}
        run: bash scripts/notify-github-status.sh stable

      - name: Notify Discord announcements channel
        env:
          DISCORD_WEBHOOK_ANNOUNCEMENTS: ${{ secrets.DISCORD_WEBHOOK_ANNOUNCEMENTS }}
          RELEASE_TAG: ${{ needs.compute-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.compute-release.outputs.version }}
        run: bash scripts/notify-discord.sh releases
