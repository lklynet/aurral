name: Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (must match the root package.json, for example 2.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  guard-main:
    needs: validate
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2

      - name: Verify main and requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Stable releases must be run from main, not ${GITHUB_REF_NAME}."
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          NORMALIZED_REQUESTED_VERSION="${REQUESTED_VERSION#v}"
          if [ "${NORMALIZED_REQUESTED_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "Requested version ${NORMALIZED_REQUESTED_VERSION} does not match package.json ${PACKAGE_VERSION}."
            exit 1
          fi

          git fetch origin "+main:refs/remotes/origin/main" --depth=1
          REMOTE_SHA="$(git rev-parse origin/main)"
          if [ "${REMOTE_SHA}" != "${GITHUB_SHA}" ]; then
            echo "Workflow commit ${GITHUB_SHA} is not current origin/main ${REMOTE_SHA}."
            exit 1
          fi

  compute-release:
    needs: guard-main
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2

      - name: Compute stable release
        id: release
        run: |
          git fetch --force --tags
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          TAGS="$(git tag --list | tr '\n' ',')"
          HEAD_TAGS="$(git tag --points-at HEAD | tr '\n' ',')"
          node scripts/resolve-next-release.js \
            --branch main \
            --target-version "${PACKAGE_VERSION}" \
            --tags "${TAGS}" \
            --head-tags "${HEAD_TAGS}" \
            --github-output true
          echo "major=${PACKAGE_VERSION%%.*}" >> "${GITHUB_OUTPUT}"
          echo "minor=${PACKAGE_VERSION%.*}" >> "${GITHUB_OUTPUT}"

  publish-image:
    needs: compute-release
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log into ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.compute-release.outputs.version }}
            type=raw,value=${{ needs.compute-release.outputs.minor }}
            type=raw,value=${{ needs.compute-release.outputs.major }}
            type=raw,value=latest

      - name: Prepare local BuildKit cache
        run: mkdir -p /home/github-runner/.cache/aurral-buildkit

      - name: Build and push stable image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ needs.compute-release.outputs.version }}
            GITHUB_REPO=${{ github.repository }}
            RELEASE_CHANNEL=stable
          cache-from: type=local,src=/home/github-runner/.cache/aurral-buildkit
          cache-to: type=local,dest=/home/github-runner/.cache/aurral-buildkit-new,mode=max

      - name: Rotate BuildKit cache
        if: always()
        run: |
          rm -rf /home/github-runner/.cache/aurral-buildkit
          mv /home/github-runner/.cache/aurral-buildkit-new /home/github-runner/.cache/aurral-buildkit || true

  create-tag:
    needs: [compute-release, publish-image]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Create or confirm annotated release tag
        env:
          RELEASE_TAG: ${{ needs.compute-release.outputs.tag }}
        run: |
          git fetch --force --tags
          if git rev-parse "${RELEASE_TAG}^{commit}" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-parse "${RELEASE_TAG}^{commit}")"
            if [ "${TAG_SHA}" != "${GITHUB_SHA}" ]; then
              echo "Tag ${RELEASE_TAG} already points to ${TAG_SHA}, not ${GITHUB_SHA}."
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already exists at this commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${GITHUB_SHA}" -m "Aurral ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

  publish-github-release:
    needs: [compute-release, create-tag]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.compute-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.compute-release.outputs.version }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists."
            exit 0
          fi

          NOTES_FILE="release-notes/${RELEASE_VERSION}.md"
          if [ -f "${NOTES_FILE}" ]; then
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "Aurral ${RELEASE_TAG}" \
              --notes-file "${NOTES_FILE}" \
              --latest
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "Aurral ${RELEASE_TAG}" \
              --generate-notes \
              --latest
          fi
