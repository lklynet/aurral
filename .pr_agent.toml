[github_app]
handle_push_trigger = true
push_commands = ["/agentic_review"]

[review_agent]
enable_incremental_review = true
persistent_comment_notification = false
inline_comments_severity_threshold = 3
issues_user_guidelines = """
Report actionable, evidence-based issues introduced by the diff. Prioritize security and privacy, incorrect behavior, data loss or corruption, persistence, and integration failures. When relevant, follow changed behavior across the browser, backend, persistence, and optional services, including unavailable or failed-service cases. Skip style-only, speculative, duplicate, and generic best-practice findings. Keep each finding concise and state its trigger and user impact. Aurral must not silently change a user's library, downloads, or external service state.
"""

[review_agent.comments_routing]
action_required = "inline"
remediation_recommended = "summary"
informational = "summary"

[review_agent_ux]
finding_overflow_count = 3
resolved_overflow_count = 1
expand_description = true
expand_code = false
expand_evidence = false
expand_prompt = false
show_dividers = false
show_daily_tips = false
show_comment_footer = false
