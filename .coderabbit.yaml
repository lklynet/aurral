# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: >-
  Report only high-confidence, actionable correctness, security, data-loss,
  release, or test failures. Do not report style, naming, refactoring,
  documentation, or speculative improvements. Keep each comment concise.

reviews:
  profile: quiet
  request_changes_workflow: false

  high_level_summary: false
  high_level_summary_in_walkthrough: false
  collapse_walkthrough: true
  review_status: false
  review_progress: true
  review_details: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: false

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  pre_merge_checks:
    docstrings:
      mode: off
    title:
      mode: off
    description:
      mode: off
    issue_assessment:
      mode: off

  tools:
    eslint:
      enabled: false
    e18e:
      enabled: false
    biome:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    hadolint:
      enabled: false
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    shellcheck:
      enabled: true

  path_instructions:
    - path: ".github/workflows/**"
      instructions: >-
        Report only high-confidence correctness, security, permissions,
        workflow, release, or data-integrity bugs. Do not report style,
        refactoring, naming, or documentation nits.
    - path: "scripts/**"
      instructions: >-
        Report only functional correctness, failure handling, security, and
        release or CI behavior. Do not report style or maintainability nits.
