x-lab-labels: &lab-labels
  org.aurral.lab.owner: ${AURRAL_LAB_OWNER:?}
  org.aurral.lab.id: ${AURRAL_LAB_ID:?}
  org.aurral.lab.worktree: ${AURRAL_LAB_WORKTREE:?}

services:
  aurral:
    build:
      context: ../..
      args:
        APP_VERSION: lab
    image: ${AURRAL_LAB_IMAGE:?}
    environment:
      AURRAL_DATA_DIR: /config
      PUID: ${AURRAL_LAB_UID:?}
      PGID: ${AURRAL_LAB_GID:?}
    volumes:
      - ${AURRAL_LAB_CONFIG_DIR:?}:/config
      - ${AURRAL_LAB_MEDIA_DIR:?}:/data
    networks: [lab]
    labels: *lab-labels
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 90

  seed:
    image: ${AURRAL_LAB_IMAGE:?}
    profiles: [seed]
    command: ["node", "/app/tests/lab/seed.mjs"]
    env_file: lab.env
    environment:
      AURRAL_DATA_DIR: /config
      PUID: ${AURRAL_LAB_UID:?}
      PGID: ${AURRAL_LAB_GID:?}
    volumes:
      - ${AURRAL_LAB_SEED_DIR:?}:/config
      - ./:/app/tests/lab:ro
    network_mode: none
    labels: *lab-labels

  gateway:
    image: ${AURRAL_LAB_IMAGE:?}
    entrypoint: ["node", "/lab/gateway.mjs", "aurral:3001"]
    user: "1001:1001"
    ports:
      - "127.0.0.1::3001"
    volumes:
      - ./gateway.mjs:/lab/gateway.mjs:ro
    networks: [lab, ingress]
    labels: *lab-labels
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      aurral:
        condition: service_healthy

  runner:
    build:
      context: ../..
      dockerfile: tests/lab/runner.Dockerfile
    image: ${AURRAL_LAB_RUNNER_IMAGE:?}
    profiles: [test]
    entrypoint: ["node", "tests/lab/runner.mjs"]
    user: "${AURRAL_LAB_UID:?}:${AURRAL_LAB_GID:?}"
    network_mode: service:aurral
    env_file: lab.env
    environment:
      CI: ${CI:-}
      AURRAL_BASE_URL: http://127.0.0.1:3001
      AURRAL_LAB_RESULTS_DIR: /results
      PLAYWRIGHT_OUTPUT_DIR: /results/artifacts
      PLAYWRIGHT_HTML_OUTPUT_DIR: /results/report
      PLAYWRIGHT_JSON_OUTPUT_FILE: /results/results.json
    volumes:
      - ${AURRAL_LAB_RESULTS_DIR:?}:/results
    labels: *lab-labels

networks:
  lab:
    internal: true
    labels: *lab-labels
  ingress:
    labels: *lab-labels
