x-lab-labels: &lab-labels
  org.aurral.lab.owner: ${AURRAL_LAB_OWNER:?}
  org.aurral.lab.id: ${AURRAL_LAB_ID:?}
  org.aurral.lab.worktree: ${AURRAL_LAB_WORKTREE:?}

services:
  aurral:
    build:
      context: ../..
      args:
        APP_VERSION: lab
    image: ${AURRAL_LAB_IMAGE:?}
    environment:
      AURRAL_DATA_DIR: /config
      PUID: ${AURRAL_LAB_UID:?}
      PGID: ${AURRAL_LAB_GID:?}
      NODE_OPTIONS: --import=/app/tests/lab/egress.mjs
      NODE_EXTRA_CA_CERTS: /lab-tls/ca.pem
      PATH: /app/tests/lab/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      OIDC_ENABLED: ${OIDC_ENABLED:?}
      OIDC_ISSUER: ${OIDC_ISSUER:?}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:?}
      OIDC_ADMIN_GROUPS: ${OIDC_ADMIN_GROUPS:?}
    volumes:
      - ${AURRAL_LAB_CONFIG_DIR:?}:/config
      - ${AURRAL_LAB_MEDIA_DIR:?}:/data
      - ${AURRAL_LAB_TLS_DIR:?}:/lab-tls:ro
      - ./:/app/tests/lab:ro
    networks: [lab]
    labels: *lab-labels
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 90
    depends_on:
      fixtures:
        condition: service_healthy

  fixtures:
    image: ${AURRAL_LAB_IMAGE:?}
    entrypoint: ["node", "/app/tests/lab/services/server.mjs"]
    user: "${AURRAL_LAB_UID:?}:${AURRAL_LAB_GID:?}"
    env_file: lab.env
    environment:
      AURRAL_LAB_JOURNAL: /results/fixtures-journal.jsonl
      AURRAL_LAB_MEDIA_ROOT: /data
      AURRAL_LAB_TLS_DIR: /lab-tls
      AURRAL_LAB_FIXTURE_STATE: /lab-fixtures/state.json
      AURRAL_LAB_DOWNLOADS: ${AURRAL_LAB_DOWNLOADS:-complete}
    volumes:
      - ./:/app/tests/lab:ro
      - ${AURRAL_LAB_RESULTS_DIR:?}:/results
      - ${AURRAL_LAB_MEDIA_DIR:?}:/data
      - ${AURRAL_LAB_TLS_DIR:?}:/lab-tls
      - ${AURRAL_LAB_FIXTURE_DIR:?}:/lab-fixtures
    networks: [lab]
    labels: *lab-labels
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 1s
      timeout: 5s
      retries: 30

  seed:
    image: ${AURRAL_LAB_IMAGE:?}
    profiles: [seed]
    command: ["node", "/app/tests/lab/seed.mjs"]
    env_file: lab.env
    environment:
      AURRAL_DATA_DIR: /config
      AURRAL_LAB_MEDIA_ROOT: /data
      PUID: ${AURRAL_LAB_UID:?}
      PGID: ${AURRAL_LAB_GID:?}
    volumes:
      - ${AURRAL_LAB_SEED_DIR:?}:/config
      - ${AURRAL_LAB_MEDIA_DIR:?}:/data
      - ./:/app/tests/lab:ro
    network_mode: none
    labels: *lab-labels

  gateway:
    image: ${AURRAL_LAB_IMAGE:?}
    entrypoint: ["node", "/lab/gateway.mjs", "aurral:3001"]
    user: "1001:1001"
    ports:
      - "127.0.0.1::3001"
    volumes:
      - ./gateway.mjs:/lab/gateway.mjs:ro
    networks: [lab, ingress]
    labels: *lab-labels
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      aurral:
        condition: service_healthy

  runner:
    build:
      context: ../..
      dockerfile: tests/lab/runner.Dockerfile
    image: ${AURRAL_LAB_RUNNER_IMAGE:?}
    profiles: [test]
    entrypoint: ["node", "tests/lab/runner.mjs"]
    user: "${AURRAL_LAB_UID:?}:${AURRAL_LAB_GID:?}"
    network_mode: service:aurral
    env_file: lab.env
    environment:
      CI: ${CI:-}
      AURRAL_BASE_URL: http://127.0.0.1:3001
      AURRAL_LAB_PUBLIC_TLS: fixtures:8443
      AURRAL_LAB_RESULTS_DIR: /results
      PLAYWRIGHT_OUTPUT_DIR: /results/artifacts
      PLAYWRIGHT_HTML_OUTPUT_DIR: /results/report
      PLAYWRIGHT_JSON_OUTPUT_FILE: /results/results.json
    volumes:
      - ${AURRAL_LAB_RESULTS_DIR:?}:/results
    labels: *lab-labels

networks:
  lab:
    internal: true
    labels: *lab-labels
  ingress:
    labels: *lab-labels
