<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aurral usage</title>
    <meta
      name="description"
      content="Anonymous usage stats from Aurral servers whose admins opted in."
    />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="https://aurral.org/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --font-sans:
          ui-sans-serif, system-ui, -apple-system, blinkmacsystemfont, "Segoe UI", sans-serif;
        --text: #ffffff;
        --text-muted: rgb(255 255 255 / 58%);
        --text-subtle: rgb(255 255 255 / 40%);
        --track: #151515;
        --up: #4ade80;
        --down: #f87171;
      }
      body {
        margin: 0;
        background: #000;
        color: var(--text);
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 1.45;
      }
      main {
        max-width: 44rem;
        margin: 0 auto;
        padding: 40px 16px 64px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.01em;
      }
      .sub {
        margin: 4px 0 0;
        color: var(--text-muted);
      }
      .sub a {
        color: inherit;
      }
      h2 {
        margin: 32px 0 8px;
        font-size: 16px;
      }
      .head,
      .bar {
        display: grid;
        grid-template-columns: minmax(7rem, 11rem) 1fr 3rem 2.5rem;
        align-items: center;
        gap: 10px;
      }
      .head {
        margin-top: 24px;
        color: var(--text-subtle);
        font-size: 11px;
      }
      .bar {
        padding: 3px 0;
        font-size: 13px;
      }
      .bar .label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .track {
        height: 6px;
        background: var(--track);
        border-radius: 4px;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        background: var(--text);
      }
      .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .pct {
        color: var(--text-muted);
      }
      .up {
        color: var(--up);
      }
      .down {
        color: var(--down);
      }
      .flat {
        color: var(--text-subtle);
      }
      .empty {
        margin-top: 32px;
        color: var(--text-muted);
      }
      @media (max-width: 480px) {
        .head,
        .bar {
          grid-template-columns: 6.5rem 1fr 2.75rem 2.25rem;
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Aurral usage</h1>
      <p class="sub" id="summary">Loading</p>
      <div id="sections"></div>
    </main>
    <script>
      const LABELS = {
        lidarr: "Lidarr",
        slskd: "slskd",
        prowlarr: "Prowlarr",
        nzbget: "NZBGet",
        sabnzbd: "SABnzbd",
        tidarr: "Tidarr",
        ytdlp: "yt-dlp",
        deemix: "deemix",
        lastfm: "Last.fm",
        listenbrainz: "ListenBrainz",
        koito: "Koito",
        ticketmaster: "Ticketmaster",
        gotify: "Gotify",
        webhooks: "Webhooks",
        plex: "Plex",
        navidrome: "Navidrome",
        jellyfin: "Jellyfin",
        customMetadata: "Custom metadata",
        usenet: "Usenet",
        share: "Aurral share",
        plugin: "Plugins",
        plugins: "Plugins",
        "spotify-playlist": "Spotify",
        "listenbrainz-playlist": "ListenBrainz playlist",
        "listenbrainz-createdfor": "ListenBrainz for you",
        "lastfm-station": "Last.fm station",
        "youtube-music-playlist": "YouTube Music",
        "deezer-playlist": "Deezer",
        "aurral-share": "Aurral share",
        desktop: "Desktop",
        mobile: "Phone",
        tablet: "Tablet",
        pwa: "Installed app",
        ios: "iOS",
        android: "Android",
        macos: "macOS",
        windows: "Windows",
        linux: "Linux",
        chromeos: "ChromeOS",
        chrome: "Chrome",
        safari: "Safari",
        firefox: "Firefox",
        edge: "Edge",
        other: "Other",
        system: "Follows system",
        light: "Light",
        dark: "Dark",
        aurral: "Aurral theme",
        preset: "Preset theme",
        custom: "Custom theme",
        oidc: "OIDC",
        proxy: "Proxy auth",
        google: "Google",
        ssoOnly: "SSO only",
        localNetworkBypass: "Local network auto-login",
        inbox: "Inbox",
        news: "News",
        missingTrackSearch: "Missing track search",
        qualityUpgrades: "Quality upgrades",
        customQuality: "Custom quality profile",
        favoriteAutoKeep: "Keep favorited flow tracks",
        pathMappings: "Path mappings",
        "editorial-playlists": "Editorial playlists",
        "share-import": "Share import",
        "download-folder-env": "Old download folder variables",
        "legacy-data-dir": "Old data folder",
        "auth-password-env": "AUTH_PASSWORD",
        "weekly-flow-api": "/api/weekly-flow",
        "weekly-flow-channel": "weekly-flow channel",
        x64: "x64",
        arm64: "arm64",
        arm: "arm",
        darwin: "macOS",
        win32: "Windows",
        freebsd: "FreeBSD",
      };
      const BUCKETS = ["0", "1", "2-9", "10-99", "100-999", "1k-9k", "10k-99k", "100k+"];
      const label = (value) =>
        LABELS[value] ?? String(value).charAt(0).toUpperCase() + String(value).slice(1);

      function reader({ installs, facts }) {
        const rows = (path, key) =>
          facts.filter((fact) => fact.path === path && (key === undefined || fact.key === key));
        const sum = (list) => {
          const totals = new Map();
          for (const [value, n] of list) totals.set(value, (totals.get(value) ?? 0) + n);
          return totals;
        };
        return {
          installs,
          list: (path) => sum(rows(path, null).map((fact) => [fact.value, fact.n])),
          present: (path) =>
            sum(
              rows(path)
                .filter((f) => f.value !== "0")
                .map((f) => [f.key, f.n]),
            ),
          picked: (path, key) => sum(rows(path, key).map((fact) => [fact.value, fact.n])),
          nested: (prefix, key) =>
            sum(
              facts
                .filter((f) => f.path.startsWith(`${prefix}.`) && f.key === key && f.value !== "0")
                .map((f) => [f.path.slice(prefix.length + 1).replaceAll('"', ""), f.n]),
            ),
        };
      }

      const SECTIONS = [
        [
          "Versions",
          (r) => {
            const versions = r.picked("$", "version");
            const grouped = new Map();
            for (const [version, n] of versions) {
              const key = String(version).startsWith("nightly") ? "Nightly" : version;
              grouped.set(key, (grouped.get(key) ?? 0) + n);
            }
            return grouped;
          },
        ],
        ["Connected", (r) => r.list("$.integrations")],
        ["Playback servers", (r) => r.present("$.playbackServers")],
        ["Downloads that finished", (r) => r.nested("$.downloads", "done")],
        ["Recommendations from", (r) => r.picked("$", "discovery")],
        ["Listening history from", (r) => r.present("$.listening")],
        ["Playlist imports", (r) => r.present("$.imports")],
        ["Devices", (r) => new Map([...r.list("$.seen.devices"), ...r.list("$.seen.display")])],
        ["Operating systems", (r) => r.list("$.seen.os")],
        ["Browsers", (r) => r.list("$.seen.browsers")],
        ["Subsonic clients", (r) => r.list("$.seen.subsonicClients")],
        ["Pages opened", (r) => r.list("$.seen.pages")],
        ["Appearance", (r) => new Map([...r.present("$.appearance"), ...r.present("$.themes")])],
        ["Sign-in", (r) => r.list("$.auth")],
        ["Turned on", (r) => r.list("$.settings")],
        ["Errors by area", (r) => r.nested("$.problems", "error")],
        ["Deprecated setups", (r) => r.list("$.deprecations")],
        ["Runs in Docker", (r) => new Map([["Docker", r.picked("$", "docker").get(1) ?? 0]])],
        ["Server OS", (r) => r.picked("$", "os")],
        ["CPU", (r) => r.picked("$", "arch")],
        ["Tracks in the Library", (r) => r.picked("$.scale", "tracks"), true],
        ["Library size in GB", (r) => r.picked("$.scale", "libraryGb"), true],
        ["Users", (r) => r.picked("$.scale", "users"), true],
        ["Plugins installed", (r) => r.picked("$.scale", "plugins"), true],
        ["Plugins turned on", (r) => r.picked("$.scale", "activePlugins"), true],
      ];

      const percent = (n, total) => (total > 0 ? (n / total) * 100 : 0);

      function delta(now, before, hasBefore) {
        const cell = document.createElement("span");
        cell.className = "num";
        if (!hasBefore) return cell;
        const change = Math.round(now - before);
        cell.textContent = change > 0 ? `+${change}` : String(change);
        cell.classList.add(change > 0 ? "up" : change < 0 ? "down" : "flat");
        return cell;
      }

      function renderSection(title, current, previous, ordered, hasBefore) {
        const entries = [...new Set([...current.totals.keys(), ...previous.totals.keys()])].map(
          (value) => [value, current.totals.get(value) ?? 0],
        );
        if (entries.length === 0) return null;
        entries.sort(
          ordered ? ([a], [b]) => BUCKETS.indexOf(a) - BUCKETS.indexOf(b) : ([, a], [, b]) => b - a,
        );
        const section = document.createElement("section");
        const heading = document.createElement("h2");
        heading.textContent = title;
        section.append(heading);
        for (const [value, n] of entries) {
          const share = percent(n, current.installs);
          const row = document.createElement("div");
          row.className = "bar";
          const name = document.createElement("span");
          name.className = "label";
          name.textContent = ordered ? value : label(value);
          const track = document.createElement("div");
          track.className = "track";
          const fill = document.createElement("div");
          fill.className = "fill";
          fill.style.width = `${share}%`;
          track.append(fill);
          const pct = document.createElement("span");
          pct.className = "num pct";
          pct.textContent = `${Math.round(share)}%`;
          const before = percent(previous.totals.get(value) ?? 0, previous.installs);
          row.append(name, track, pct, delta(share, before, hasBefore));
          section.append(row);
        }
        return section;
      }

      async function load() {
        const summary = document.getElementById("summary");
        const container = document.getElementById("sections");
        try {
          const response = await fetch("/api/stats");
          if (!response.ok) throw new Error(String(response.status));
          const stats = await response.json();
          const current = reader(stats);
          const previous = reader(stats.previous);
          const through = new Date(stats.through * 1000).toLocaleDateString(undefined, {
            month: "short",
            day: "numeric",
            timeZone: "UTC",
          });
          summary.innerHTML = "";
          summary.append(
            `${stats.installs.toLocaleString()} servers reported in the 3 days before ${through}. Admins opt in from Settings. `,
          );
          const docs = document.createElement("a");
          docs.href = "https://docs.aurral.org/admin/usage-stats/";
          docs.textContent = "What's collected";
          summary.append(docs);
          if (stats.installs === 0) {
            container.innerHTML = '<p class="empty">No reports yet.</p>';
            return;
          }
          const hasBefore = stats.previous.installs > 0;
          const head = document.createElement("div");
          head.className = "head";
          head.innerHTML =
            '<span></span><span></span><span class="num">Servers</span><span class="num">30d</span>';
          container.append(head);
          for (const [title, pick, ordered] of SECTIONS) {
            const section = renderSection(
              title,
              { installs: current.installs, totals: pick(current) },
              { installs: previous.installs, totals: pick(previous) },
              ordered === true,
              hasBefore,
            );
            if (section) container.append(section);
          }
        } catch {
          summary.textContent = "Couldn't load usage stats.";
        }
      }

      load();
    </script>
  </body>
</html>
